<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Trip budget</title></head>
<body data-theme="sunset">
<main class="narrow section tight">
  <span class="eyebrow">Tool</span><h1 style="font-size:2.4rem">Trip budget</h1>
  <p class="lead">Add your expenses, see the total and the share per person.</p>
  <form class="card form" id="f">
    <div class="grid-2"><div class="field"><label for="what">Expense</label><input id="what" placeholder="Train tickets" required></div>
      <div class="field"><label for="amount">Amount (€)</label><input id="amount" type="number" min="0" step="0.01" placeholder="120" required></div></div>
    <div class="row"><div class="field" style="flex:1"><label for="people">People</label><input id="people" type="number" min="1" value="2"></div>
      <button class="btn" style="align-self:flex-end"><i data-icon="plus"></i> Add</button></div>
  </form>
  <div class="grid-2" style="margin:24px 0"><div class="kpi"><span class="label">Total</span><span class="num" id="total">€0</span></div><div class="kpi"><span class="label">Per person</span><span class="num" id="each">€0</span></div></div>
  <div class="card"><div class="table-wrap"><table><thead><tr><th>Expense</th><th>Amount</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="3" class="muted">No expense yet.</td></tr></tbody></table></div></div>
</main>
<script>
const items = []; const eur = (n) => '€' + n.toLocaleString(undefined, { maximumFractionDigits: 2 });
const $ = (id) => document.getElementById(id);
function draw() {
  const total = items.reduce((s, i) => s + i.amount, 0), people = Math.max(1, +$('people').value || 1);
  $('total').textContent = eur(total); $('each').textContent = eur(total / people);
  $('rows').innerHTML = items.length ? items.map((i, k) => `<tr><td>${i.what.replace(/</g, '&lt;')}</td><td>${eur(i.amount)}</td><td><button class="btn sm ghost" data-k="${k}">Remove</button></td></tr>`).join('') : '<tr><td colspan="3" class="muted">No expense yet.</td></tr>';
}
$('f').addEventListener('submit', (e) => { e.preventDefault(); items.push({ what: $('what').value, amount: +$('amount').value || 0 }); $('what').value = ''; $('amount').value = ''; draw(); $('what').focus(); });
$('rows').addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b) { items.splice(+b.dataset.k, 1); draw(); } });
$('people').addEventListener('input', draw);
</script>
</body>
</html>
