<!doctype html>
<html lang="en">
<head>

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:" />

  <title>Fabro</title>
  <link rel="stylesheet" href="styles.css" />

<body>

  <script src="../../node_modules/dompurify/dist/purify.min.js"></script>

  <script src="i18n.js"></script>
