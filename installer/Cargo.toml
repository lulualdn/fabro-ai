[package]
name = "fabro-installer"
version = "0.1.15"
edition = "2021"
description = "Fabro installer & updater"
publish = false

[[bin]]
name = "Fabro-Installer"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
sys-locale = "0.3"
rfd = { version = "0.17", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
