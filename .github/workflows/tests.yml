name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Providers (offline adapters)
        run: node scripts/providers-test.js
      - name: Agent runtime (permissions, files, terminal, fallback)
        run: node scripts/agent-test.js
      - name: Website builds (all pages, all languages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node site/build.js 2>&1 | tee site-build.log && ! grep -q "missing in" site-build.log
      - name: End-to-end UI (Electron + Playwright)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1440x900x24" node scripts/e2e.js e2e-shots
      - name: Browser cookie import (Firefox + Chromium decrypt, domain filter)
        run: node scripts/browser-import-test.js
      - name: Mods (Claude for Fabro on a local copy of the site), fabro:// links, paste, quick bar
        run: xvfb-run -a -s "-screen 0 1440x900x24" node scripts/mods-e2e.js e2e-shots/mods
      - name: Designed PDFs the AI can see and fix
        run: xvfb-run -a node scripts/layout-test.js e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore

  anywhere:
    # Fabro Anywhere: crypto, the circular code read from camera-like pictures, and the real app paired with
    # the phone app (mobile Chrome, fake camera) through a local relay: chat, sync, photo, push, queue, revoke.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core (Reed-Solomon, code, pairing, sessions, merge, Web Push)
        run: node scripts/anywhere-test.js
      - name: Circular code read back from pictures
        run: node scripts/ringcode-test.js
      - name: Computer ↔ phone end to end
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1440x900x24" node scripts/anywhere-e2e.js anywhere-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anywhere-screenshots
          path: anywhere-shots
          if-no-files-found: ignore

  search:
    # Private SearXNG installed by Fabro itself + the agent browser on real websites.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: SearXNG + agent browser (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a node scripts/search-smoke.js
      - name: SearXNG + agent browser (Windows)
        if: runner.os == 'Windows'
        run: node scripts/search-smoke.js

  agent-real:
    # A real 4B model on Fabro's own engine must use its tools (reads, writes, runs) — not refuse or invent.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Agent with Qwen3.5 4B (CPU)
        run: node scripts/agent-real.js

  voice:
    # Local voice stack installed by the app itself (Whisper + Piper), spoken question through a fake mic.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Voice mode (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          SHOTS=. xvfb-run -a node scripts/voice-smoke.js
      - name: Voice mode (Windows)
        if: runner.os == 'Windows'
        run: node scripts/voice-smoke.js
        env:
          SHOTS: .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-${{ matrix.os }}
          path: voice-mode.png
          if-no-files-found: ignore

  images:
    # stable-diffusion.cpp build picked for the runner + SD Turbo, one real image.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # GitHub's macOS runners are virtual machines whose GPU cannot run stable-diffusion.cpp's Metal
    # backend ("buffer is nil"); install and model download are still checked there, the image is not.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/images-smoke.js
        env:
          SHOTS: .
          # Linux exercises the no-API path (release page), the others use the API with the CI token.
          FABRO_GH_PAGE_ONLY: ${{ runner.os == 'Linux' && '1' || '' }}
          GITHUB_TOKEN: ${{ runner.os != 'Linux' && secrets.GITHUB_TOKEN || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-${{ matrix.os }}
          path: generated.png
          if-no-files-found: ignore
