name: Engine smoke test

on:
  push:
    branches: [main]
    paths: ['src/main/**', 'scripts/engine-smoke.js', '.github/workflows/engine-smoke.yml', 'package.json']
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, accel: '' }
          - { os: windows-latest, accel: cuda }   # exercises CUDA build + CPU fallback on a GPU-less runner
          - { os: ubuntu-latest, accel: '' }
          - { os: macos-latest, accel: '' }
          - { os: macos-15-intel, accel: '' }   # Intel Mac: llama.cpp macos-x64 build, CPU
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install engine, load a tiny model, chat
        run: node scripts/engine-smoke.js
        env:
          FORCE_ACCEL: ${{ matrix.accel }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
