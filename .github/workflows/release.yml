name: Build & release

on:
  push:
    branches: [main]      # every push builds installers (artifacts); "[release]" in the commit message publishes
    tags: ['v*']          # or push a v* tag to publish
  workflow_dispatch:      # manual run → builds installers as downloadable artifacts

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (publish on tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no code signing for now
        run: npx electron-builder --publish ${{ (startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')) && 'always' || 'never' }}
      - uses: actions/upload-artifact@v4
        with:
          name: fabro-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: ignore
